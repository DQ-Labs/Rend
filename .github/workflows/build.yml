name: Build and Release Rend

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  # Headless tests against rend_core (no GUI, no demucs, no model downloads).
  # Runs on every push and PR; the build job only starts after tests pass.
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==8.4.1

      - name: Run Tests
        run: |
          pytest tests/ -v

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify tag matches config.APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # The release tag must match the app's single source of truth (config.py),
          # so the installer, About pane, and GitHub release can never drift apart.
          $version = python -c "import config; print(config.APP_VERSION)"
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            Write-Error "Tag '$tag' does not match config.APP_VERSION 'v$version' — bump config.py or retag."
            exit 1
          }
          Write-Host "Tag $tag matches config.APP_VERSION."

      - name: Install FFmpeg
        shell: pwsh
        run: |
          # Install via Chocolatey — package integrity is verified by Chocolatey's checksum system.
          # Version pinned so every build ships the same ffmpeg.
          choco install ffmpeg --version 8.1.2 --yes --no-progress
          # Chocolatey creates shim wrappers in its bin folder — those are not standalone binaries
          # and will not work when bundled by PyInstaller. Copy the real executables instead.
          $ffmpegExe = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination ".\ffmpeg.exe"
          Copy-Item $ffprobeExe.FullName -Destination ".\ffprobe.exe"
          Write-Host "Bundling ffmpeg from: $($ffmpegExe.FullName)"
          Write-Host "Bundling ffprobe from: $($ffprobeExe.FullName)"

      - name: Prepare Demucs Source
        shell: pwsh
        run: |
          # Pin to a specific commit SHA — demucs has no release tag that includes demucs.api
          # e976d93 is the latest commit on main as of 2023-11-16 and is the version this app was built against
          git clone https://github.com/facebookresearch/demucs.git demucs_source
          git -C demucs_source checkout e976d93ecc3865e5757426930257e200846a520a
          
          # Patch requirements_minimal.txt
          $reqFile = "demucs_source/requirements_minimal.txt"
          if (Test-Path $reqFile) {
              Write-Host "Patching $reqFile..."
              $content = Get-Content $reqFile
              $content = $content | Where-Object { $_ -notmatch "lameenc" -and $_ -notmatch "torchaudio" }
              Set-Content -Path $reqFile -Value $content
          }

          # Patch audio.py
          $audioFile = "demucs_source/demucs/audio.py"
          if (Test-Path $audioFile) {
              Write-Host "Patching $audioFile..."
              $audioContent = Get-Content $audioFile -Raw
              $audioContent = $audioContent -replace "import lameenc", "try:`r`n    import lameenc`r`nexcept ImportError:`r`n    lameenc = None"
              Set-Content -Path $audioFile -Value $audioContent
          }

      - name: Install Dependencies
        run: |
          # pyinstaller is a build tool — kept separate from runtime requirements
          pip install pyinstaller==6.17.0
          # requirements.txt is the single source of truth for runtime deps (torch, customtkinter, etc.)
          pip install -r requirements.txt
          # demucs is vendored from source at a pinned commit
          pip install -e ./demucs_source

      - name: Build EXE
        run: |
          pyinstaller Rend.spec

      - name: Build Installer
        shell: pwsh
        run: |
          # Wrap the PyInstaller exe with Inno Setup: Start-menu entry,
          # Apps & Features uninstaller, predictable install location.
          # Version pinned so every build uses the same compiler.
          choco install innosetup --version 6.4.3 --yes --no-progress
          # Reads name/version/publisher/URLs from config.py and passes
          # them to ISCC as /D defines — no identity duplicated in the .iss.
          python installer/build_installer.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Rend-Windows-Installer
          path: dist/installer/Rend-Setup-*.exe

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          # Draft so the artifact can be install-tested on a clean machine
          # before the release is published by hand.
          draft: true
          # The installer — not the bare exe — is what users download.
          files: dist/installer/Rend-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
