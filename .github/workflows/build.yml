name: Build and Release Rend

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        shell: pwsh
        run: |
          # Install via Chocolatey — package integrity is verified by Chocolatey's checksum system
          choco install ffmpeg --yes --no-progress
          # Copy binaries to project root so PyInstaller can bundle them (see Rend.spec binaries)
          Copy-Item (Get-Command ffmpeg).Source -Destination ".\ffmpeg.exe"
          Copy-Item (Get-Command ffprobe).Source -Destination ".\ffprobe.exe"

      - name: Prepare Demucs Source
        shell: pwsh
        run: |
          # Pin to a specific release tag — never pull from an unpinned HEAD
          git clone --depth 1 --branch v4.0.1 https://github.com/facebookresearch/demucs.git demucs_source
          
          # Patch requirements_minimal.txt
          $reqFile = "demucs_source/requirements_minimal.txt"
          if (Test-Path $reqFile) {
              Write-Host "Patching $reqFile..."
              $content = Get-Content $reqFile
              $content = $content | Where-Object { $_ -notmatch "lameenc" -and $_ -notmatch "torchaudio" }
              Set-Content -Path $reqFile -Value $content
          }

          # Patch audio.py
          $audioFile = "demucs_source/demucs/audio.py"
          if (Test-Path $audioFile) {
              Write-Host "Patching $audioFile..."
              $audioContent = Get-Content $audioFile -Raw
              $audioContent = $audioContent -replace "import lameenc", "try:`r`n    import lameenc`r`nexcept ImportError:`r`n    lameenc = None"
              Set-Content -Path $audioFile -Value $audioContent
          }

      - name: Install Dependencies
        run: |
          pip install customtkinter pyinstaller soundfile
          pip install -e ./demucs_source

      - name: Build EXE
        run: |
          pyinstaller Rend.spec

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rend-Windows-Exe
          path: dist/Rend.exe

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/Rend.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
